services:
  - type: web
    name: goblins
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: goblin-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false

databases:
  - name: goblin-db
    databaseName: goblins
    plan: free